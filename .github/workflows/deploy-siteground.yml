name: Deploy to SiteGround (SSH)

on:
  push:
    branches:
      - main
      - claude/inspiring-goldberg-pRkA8
    paths:
      - "site/**"
      - "scripts/deploy-siteground.sh"
      - ".github/workflows/deploy-siteground.yml"
  workflow_dispatch:

concurrency:
  group: deploy-siteground
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SG_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SG_SSH_PORT:-18765}" -H "${{ secrets.SG_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
        env:
          SG_SSH_PORT: ${{ secrets.SG_SSH_PORT }}

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude ".DS_Store" \
            --exclude "README.md" \
            -e "ssh -p ${SG_SSH_PORT:-18765} -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            site/ "${SG_SSH_USER}@${SG_SSH_HOST}:${SG_DEPLOY_PATH}/"
        env:
          SG_SSH_HOST: ${{ secrets.SG_SSH_HOST }}
          SG_SSH_USER: ${{ secrets.SG_SSH_USER }}
          SG_SSH_PORT: ${{ secrets.SG_SSH_PORT }}
          SG_DEPLOY_PATH: ${{ secrets.SG_DEPLOY_PATH }}
